name: app
description: "Smart Irrigation System - Mobile Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_database: ^12.3.0
  firebase_auth: ^6.4.0

  # State Management
  flutter_riverpod: ^3.3.1

  # Routing
  go_router: ^17.2.1

  # UI
  google_fonts: ^8.0.2
  percent_indicator: ^4.2.3
  connectivity_plus: ^7.1.1
  intl: ^0.20.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
